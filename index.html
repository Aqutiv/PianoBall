<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04050d" />
    <meta name="description" content="Musical pinball played with a MIDI keyboard." />
    <title>PianoBall</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- What a pasted link looks like in Discord, Slack, iMessage and the rest.
         These two URLs are absolute on purpose: a scraper fetches them with no
         page context, so the relative `base` Vite uses everywhere else would
         have nothing to resolve against. They are the one place in the app
         that hardcodes where it is deployed. Card art: npm run og. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PianoBall" />
    <meta property="og:title" content="PianoBall" />
    <meta property="og:description" content="Musical pinball played with a MIDI keyboard." />
    <meta property="og:url" content="https://aqutiv.github.io/PianoBall/" />
    <meta property="og:image" content="https://aqutiv.github.io/PianoBall/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A chrome ball streaking over a neon pinball table with piano keys along its near edge." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <div id="playfield">
        <canvas id="table" aria-label="PianoBall playfield"></canvas>
      </div>
      <div id="hud" class="hud" aria-live="off"></div>
      <div id="overlay" class="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
